services:
  db:
    image: postgres:16-alpine
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn lucky_check.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      PROMO_START_DATE: ${PROMO_START_DATE}
      PROMO_END_DATE: ${PROMO_END_DATE}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:

